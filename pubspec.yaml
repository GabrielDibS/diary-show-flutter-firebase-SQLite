name: diario_shows
description: "Diário de Shows - app Flutter com Firebase, SQLite (offline first), GPS, calendário e API TheAudioDB."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.4.0
  url_launcher: ^6.3.1

  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  sqflite: any
  path: any
  path_provider: any
  connectivity_plus: any
  geolocator: any
  table_calendar: any
  image_picker: any
  uuid: any
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/imagens/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png

flutter_native_splash:
  color: "#13151C"
  image: assets/icon/splash.png
  android: true
  ios: false
  android_12:
    color: "#13151C"
    image: assets/icon/splash.png
